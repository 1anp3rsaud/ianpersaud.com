<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travels — Ian Persaud</title>
  <meta name="description" content="Travels — Ian Persaud">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    /* Full-width flex layout: sidebar + map */
    .travels-layout {
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
      display: flex;
      height: calc(100vh - 200px);
      min-height: 480px;
      margin-top: 1rem;
      margin-bottom: 0;
    }

    /* ── Sidebar ────────────────────────────────────────────────── */
    .travels-sidebar {
      width: 210px;
      flex-shrink: 0;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 0.8rem 0.75rem;
      font-family: 'Geist Mono', monospace;
      font-size: 0.58rem;
      color: var(--text);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .travels-sidebar::-webkit-scrollbar { width: 4px; }
    .travels-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sb-title {
      font-size: 0.6rem;
      color: var(--tg);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }
    .sb-stat { color: var(--muted); margin-bottom: 0.12rem; line-height: 1.5; }
    .sb-stat strong { color: var(--text); }
    .sb-divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }

    .sb-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.48rem;
      margin: 0.55rem 0 0.2rem;
    }
    .sb-item { color: var(--text); line-height: 1.65; }
    .sb-item-home { color: #4da6ff; }
    .sb-item-park { color: var(--muted); }

    /* US state blocks */
    .sb-state { margin-bottom: 0.55rem; }
    .sb-state-name {
      color: var(--tg);
      font-size: 0.57rem;
      margin-bottom: 0.1rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .sb-state-count { color: var(--muted); font-size: 0.5rem; }
    .sb-state-cities { padding-left: 0.6rem; }

    /* Sort / filter controls */
    .sb-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.22rem;
      margin-bottom: 0.3rem;
    }
    .sb-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Geist Mono', monospace;
      font-size: 0.48rem;
      padding: 0.12rem 0.32rem;
      cursor: pointer;
      border-radius: 2px;
      line-height: 1.4;
    }
    .sb-btn:hover { border-color: var(--tg); color: var(--tg); }
    .sb-btn.active { border-color: var(--tg); color: var(--tg); background: rgba(57,255,20,0.07); }

    /* ── Map area ───────────────────────────────────────────────── */
    .map-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    #travels-map { width: 100%; height: 100%; }

    html.dark       #travels-map { background: #0a0a0a; }
    html:not(.dark) #travels-map { background: #dce8ec; }

    .country-glow { /* glow applied via JS buildGlow() */ }

    .leaflet-tooltip.map-tt {
      background: var(--bg);
      border: 1px solid var(--tg);
      color: var(--text);
      font-family: 'Geist Mono', monospace;
      font-size: 0.6rem;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      box-shadow: none;
      white-space: nowrap;
    }
    .leaflet-tooltip.map-tt.leaflet-tooltip-top::before    { border-top-color: var(--tg); }
    .leaflet-tooltip.map-tt.leaflet-tooltip-bottom::before { border-bottom-color: var(--tg); }

    .leaflet-tooltip.map-tt-country {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: rgba(210, 210, 210, 0.8);
      font-family: 'Geist Mono', monospace;
      font-size: 0.55rem;
      padding: 0.15rem 0.4rem;
      border-radius: 2px;
      box-shadow: none;
      white-space: nowrap;
      pointer-events: none;
    }
    .leaflet-tooltip.map-tt-country::before { display: none; }

    #world-btn {
      display: none;
      position: absolute;
      top: 80px;
      left: 10px;
      z-index: 1000;
      background: var(--bg);
      border: 1px solid var(--tg);
      color: var(--tg);
      font-family: 'Geist Mono', monospace;
      font-size: 0.6rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border-radius: 2px;
    }
    #world-btn:hover { background: rgba(57, 255, 20, 0.1); }

    #map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Geist Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      z-index: 900;
      pointer-events: none;
    }

    .leaflet-interactive:focus { outline: none; }

    .leaflet-control-zoom a {
      background: var(--bg) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      font-family: 'Geist Mono', monospace !important;
    }
    .leaflet-control-zoom a:hover { color: var(--tg) !important; }

    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.45) !important;
      color: rgba(180, 180, 180, 0.5) !important;
      font-size: 0.45rem !important;
    }
    .leaflet-control-attribution a { color: rgba(180, 180, 180, 0.6) !important; }

    /* Legend */
    .map-legend {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 0.4rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .map-legend span { display: flex; align-items: center; gap: 0.3rem; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  </style>
</head>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/js/site.js"></script>
  <script>

    // ── Map init ───────────────────────────────────────────────────────────────
    var map = L.map('travels-map', {
      zoomControl: true,
      scrollWheelZoom: false,
      minZoom: 2,
      maxZoom: 13,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0,
      worldCopyJump: false
    }).setView([20, 15], 2);

    var TG   = '#39ff14';
    var BLUE = '#4da6ff';

    // ── US Region → state abbr mapping ────────────────────────────────────────
    var stateRegions = {
      // Northeast
      CT:'northeast', DC:'northeast', DE:'northeast', MA:'northeast',
      MD:'northeast', ME:'northeast', NH:'northeast', NJ:'northeast',
      NY:'northeast', PA:'northeast', RI:'northeast', VT:'northeast',
      // Appalachia
      KY:'appalachia', NC:'appalachia', TN:'appalachia', VA:'appalachia', WV:'appalachia',
      // South
      AL:'south', AR:'south', FL:'south', GA:'south', LA:'south',
      MS:'south', OK:'south', SC:'south', TX:'south',
      // Midwest
      IA:'midwest', IL:'midwest', IN:'midwest', KS:'midwest', MI:'midwest',
      MN:'midwest', MO:'midwest', ND:'midwest', NE:'midwest', OH:'midwest',
      SD:'midwest', WI:'midwest',
      // West
      AK:'west', AZ:'west', CA:'west', CO:'west', HI:'west',
      ID:'west', MT:'west', NM:'west', NV:'west', OR:'west',
      UT:'west', WA:'west', WY:'west'
    };

    var stateNames = {
      AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California',
      CO:'Colorado', CT:'Connecticut', DC:'Washington D.C.', DE:'Delaware',
      FL:'Florida', GA:'Georgia', HI:'Hawaii', ID:'Idaho', IL:'Illinois',
      IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana',
      ME:'Maine', MD:'Maryland', MA:'Massachusetts', MI:'Michigan', MN:'Minnesota',
      MS:'Mississippi', MO:'Missouri', MT:'Montana', NE:'Nebraska', NV:'Nevada',
      NH:'New Hampshire', NJ:'New Jersey', NM:'New Mexico', NY:'New York',
      NC:'North Carolina', ND:'North Dakota', OH:'Ohio', OK:'Oklahoma', OR:'Oregon',
      PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina', SD:'South Dakota',
      TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont', VA:'Virginia',
      WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming'
    };

    // Normalize full state names used in usData to abbreviations
    var stateAliases = { 'Maine':'ME', 'Oregon':'OR', 'D.C.':'DC' };
    function normState(s) { return stateAliases[s] || s; }

    // ── Interactive map regions ────────────────────────────────────────────────
    var regions = {
      usa:       { codes: ['USA'],                               bounds: [[24.0, -125.5], [49.5,  -66.0]], density: 5 },
      eastAsia:  { codes: ['JPN', 'CHN', 'HKG'],                bounds: [[18.0,  97.0],  [50.0,  148.0]], density: 4 },
      europe:    { codes: ['GBR', 'CZE', 'ESP', 'FRA', 'ITA'],  bounds: [[36.0, -10.0],  [60.0,   22.0]], density: 3 },
      caribbean: { codes: ['LCA', 'SXM', 'MAF', 'MEX', 'CRI'],  bounds: [[ 8.0, -93.0],  [28.0,  -55.0]], density: 2 },
      india:     { codes: ['IND'],                               bounds: [[ 8.0,  68.0],  [36.0,   98.0]], density: 1 }
    };

    var countryCities = {
      JPN:6, CHN:4, HKG:4, ITA:2, IND:2,
      GBR:1, CZE:1, ESP:1, FRA:1, LCA:1, SXM:1, MAF:1, MEX:1, CRI:1, USA:40
    };

    var densityPadding = { 5:20, 4:25, 3:30, 2:38, 1:55 };

    var regionMeta = {
      usa:       'United States',
      eastAsia:  'East Asia',
      europe:    'Western Europe',
      caribbean: 'Caribbean & Lat. Am.',
      india:     'South Asia'
    };

    var regionSort = 'cities-desc';

    var countryToRegion = {};
    Object.keys(regions).forEach(function(key) {
      regions[key].codes.forEach(function(code) { countryToRegion[code] = key; });
    });

    // ── Country code → sidebar data ────────────────────────────────────────────
    // CHN and HKG share a display group; MAF shares with SXM
    var countryInfo = {
      ITA: { name: 'Italy',          cities: ['Florence', 'Cinque Terre'] },
      JPN: { name: 'Japan',          cities: ['Tokyo', 'Kyoto', 'Osaka', 'Hiroshima', 'Hakone', 'Nagano'] },
      GBR: { name: 'England',        cities: ['London'] },
      CZE: { name: 'Czech Republic', cities: ['Prague'] },
      ESP: { name: 'Spain',          cities: ['Barcelona'] },
      FRA: { name: 'France',         cities: ['Paris'] },
      CHN: { name: 'China / HK',     cities: ['Hong Kong', 'Beijing', 'Shanghai', "Xi'an"] },
      HKG: { name: 'China / HK',     cities: ['Hong Kong', 'Beijing', 'Shanghai', "Xi'an"] },
      LCA: { name: 'St. Lucia',      cities: ['Castries'] },
      SXM: { name: 'Sint Maarten',   cities: ['Philipsburg'] },
      MAF: { name: 'Sint Maarten',   cities: ['Philipsburg'] },
      MEX: { name: 'Mexico',         cities: ['Cancún'] },
      IND: { name: 'India',          cities: ['Hyderabad', 'Tirupati'] },
      CRI: { name: 'Costa Rica',     cities: ['San José'] },
      USA: { name: 'United States',  cities: [] }
    };

    // ── Dynamic glow function ──────────────────────────────────────────────────
    function buildGlow(count) {
      var ratio = Math.log(count + 1) / Math.log(41);
      var r1 = Math.round(4  + ratio * 20);
      var r2 = Math.round(10 + ratio * 55);
      var o1 = +(0.40 + ratio * 0.45).toFixed(2);
      var o2 = +(0.15 + ratio * 0.30).toFixed(2);
      var f  = 'drop-shadow(0 0 '+ r1 +'px rgba(57,255,20,'+ o1 +')) ' +
               'drop-shadow(0 0 '+ r2 +'px rgba(57,255,20,'+ o2 +'))';
      if (ratio > 0.50)
        f += ' drop-shadow(0 0 '+ Math.round(r2 * 1.8) +'px rgba(57,255,20,0.09))';
      return f;
    }

    // ── Sidebar state ──────────────────────────────────────────────────────────
    var sbBase   = 'world';   // persistent: 'world' | region key
    var sbHover  = null;      // country ADM0_A3 code when hovering, else null
    var usSort   = 'cities-desc';  // 'cities-desc' | 'cities-asc' | 'alpha'
    var usRegion = 'all';     // 'all' | 'northeast' | 'appalachia' | 'south' | 'midwest' | 'west'

    var currentRegion      = null;
    var ignoreNextMapClick = false;

    // ── Shared world-view reset ────────────────────────────────────────────────
    function resetToWorldView() {
      currentRegion = null;
      sbBase        = 'world';
      sbHover       = null;
      setUSMarkers(false);
      if (statesLayer && map.hasLayer(statesLayer)) map.removeLayer(statesLayer);
      map.flyTo([20, 15], 2, { duration: 1.4 });
      renderSidebar();
    }

    // ── Pin factories ──────────────────────────────────────────────────────────
    function dotIcon(color) {
      return L.divIcon({
        className: '',
        html: '<div style="width:8px;height:8px;border-radius:50%;background:' + color + ';box-shadow:0 0 6px ' + color + ';"></div>',
        iconSize: [8, 8], iconAnchor: [4, 4], tooltipAnchor: [4, -6]
      });
    }
    function treeIcon() {
      return L.divIcon({
        className: '',
        html: '<span style="font-size:14px;line-height:1;display:block;">🌲</span>',
        iconSize: [16, 16], iconAnchor: [8, 10], tooltipAnchor: [8, -10]
      });
    }

    // ── International cities (always visible) ──────────────────────────────────
    var intl = [
      ['Florence',      'Italy',          43.7696,  11.2558],
      ['Cinque Terre',  'Italy',          44.1461,   9.6439],
      ['Tokyo',         'Japan',          35.6762, 139.6503],
      ['Kyoto',         'Japan',          35.0116, 135.7681],
      ['Osaka',         'Japan',          34.6937, 135.5023],
      ['Hiroshima',     'Japan',          34.3853, 132.4553],
      ['Hakone',        'Japan',          35.2323, 139.1069],
      ['Nagano',        'Japan',          36.6485, 138.1957],
      ['London',        'England',        51.5074,  -0.1278],
      ['Prague',        'Czech Republic', 50.0755,  14.4378],
      ['Barcelona',     'Spain',          41.3851,   2.1734],
      ['Paris',         'France',         48.8566,   2.3522],
      ['Hong Kong',     'China',          22.3193, 114.1694],
      ['Beijing',       'China',          39.9042, 116.4074],
      ['Shanghai',      'China',          31.2304, 121.4737],
      ["Xi'an",         'China',          34.3416, 108.9398],
      ['Castries',      'St. Lucia',      14.0101, -60.9875],
      ['Philipsburg',   'Sint Maarten',   18.0231, -63.0472],
      ['Cancún',        'Mexico',         21.1619, -86.8515],
      ['Hyderabad',     'India',          17.3850,  78.4867],
      ['Tirupati',      'India',          13.6288,  79.4192],
      ['San José',      'Costa Rica',      9.9281,  -84.0907]
    ];

    intl.forEach(function(c) {
      L.marker([c[2], c[3]], { icon: dotIcon(TG) })
        .bindTooltip(c[0] + ', ' + c[1], { className: 'map-tt', direction: 'top' })
        .addTo(map);
    });

    // ── US cities (shown only when US region is active) ────────────────────────
    var usData = [
      ['New York City',  'NY',      40.7128,  -74.0060, true ],
      ['Boston',         'MA',      42.3601,  -71.0589, false],
      ['Portland',       'Maine',   43.6591,  -70.2568, false],
      ['Portland',       'Oregon',  45.5051, -122.6750, false],
      ['San Francisco',  'CA',      37.7749, -122.4194, false],
      ['Los Angeles',    'CA',      34.0522, -118.2437, false],
      ['San Diego',      'CA',      32.7157, -117.1611, false],
      ['Las Vegas',      'NV',      36.1699, -115.1398, false],
      ['San Jose',       'CA',      37.3382, -121.8863, false],
      ['Austin',         'TX',      30.2672,  -97.7431, false],
      ['San Antonio',    'TX',      29.4241,  -98.4936, false],
      ['New Orleans',    'LA',      29.9511,  -90.0715, false],
      ['Washington',     'D.C.',    38.9072,  -77.0369, false],
      ['Baltimore',      'MD',      39.2904,  -76.6122, false],
      ['Philadelphia',   'PA',      39.9526,  -75.1652, false],
      ['Pittsburgh',     'PA',      40.4406,  -79.9959, false],
      ['Providence',     'RI',      41.8240,  -71.4128, false],
      ['Orlando',        'FL',      28.5383,  -81.3792, false],
      ['Atlanta',        'GA',      33.7490,  -84.3880, false],
      ['Charlotte',      'NC',      35.2271,  -80.8431, false],
      ['Chicago',        'IL',      41.8781,  -87.6298, false],
      ['Minneapolis',    'MN',      44.9778,  -93.2650, false],
      ['Columbus',       'OH',      39.9612,  -82.9988, false],
      ['Cleveland',      'OH',      41.4993,  -81.6944, false],
      ['Burlington',     'VT',      44.4759,  -73.2121, false],
      ['Ithaca',         'NY',      42.4440,  -76.5021, false],
      ['Hartford',       'CT',      41.7658,  -72.6851, false],
      ['Beacon',         'NY',      41.5051,  -73.9696, false],
      ['Concord',        'MA',      42.4604,  -71.3489, false],
      ['The Hamptons',   'NY',      40.9315,  -72.1859, false],
      ['Montauk',        'NY',      41.0534,  -71.9566, false],
      ['Buffalo',        'NY',      42.8864,  -78.8784, false],
      ['Binghamton',     'NY',      42.0987,  -75.9179, false],
      ['New Paltz',      'NY',      41.7462,  -74.0921, false],
      ['Denver',         'CO',      39.7392, -104.9903, false],
      ['Harpers Ferry',  'WV',      39.3251,  -77.7311, false],
      ['Nashville',      'TN',      36.1627,  -86.7816, false],
      ['Cape Cod',       'MA',      41.6688,  -70.2962, false],
      ['Sarasota',       'FL',      27.3364,  -82.5307, false],
      ['Bozeman',        'MT',      45.6770, -111.0429, false]
    ];

    var usParks = [
      ['Shenandoah National Park',          'Virginia',  'VA', 38.4755,  -78.4535],
      ['Yellowstone National Park',          'Wyoming',   'WY', 44.4280, -110.5885],
      ['Everglades National Park',           'Florida',   'FL', 25.2866,  -80.8987],
      ['Fire Island National Seashore',      'New York',  'NY', 40.7190,  -73.1357],
      ['Gateway National Recreation Area',   'New York',  'NY', 40.5618,  -74.0582]
    ];

    // Map markers
    var usMarkers = [];
    usData.forEach(function(c) {
      var label = c[4] ? c[0] + ' (home)' : c[0] + ', ' + normState(c[1]);
      var m = L.marker([c[2], c[3]], { icon: dotIcon(c[4] ? BLUE : TG) })
        .bindTooltip(label, { className: 'map-tt', direction: 'top' });
      usMarkers.push(m);
    });
    usParks.forEach(function(p) {
      var m = L.marker([p[3], p[4]], { icon: treeIcon() })
        .bindTooltip(p[0] + ', ' + p[1], { className: 'map-tt', direction: 'top' });
      usMarkers.push(m);
    });

    function setUSMarkers(show) {
      usMarkers.forEach(function(m) {
        if (show  && !map.hasLayer(m)) m.addTo(map);
        if (!show &&  map.hasLayer(m)) map.removeLayer(m);
      });
    }

    // ── State boundaries layer ─────────────────────────────────────────────────
    var statesLayer = null;
    fetch('assets/data/us-states.geojson')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        statesLayer = L.geoJSON(data, {
          style: { fillColor:'transparent', fillOpacity:0, color:'rgba(57,255,20,0.18)', weight:0.5 },
          interactive: false
        });
        if (currentRegion === 'usa') statesLayer.addTo(map);
      });

    // ── Sidebar data ───────────────────────────────────────────────────────────
    // Unique countries for the intl list
    var intlCountries = [];
    var _seenCountries = {};
    intl.forEach(function(c) {
      if (!_seenCountries[c[1]]) { _seenCountries[c[1]] = true; intlCountries.push(c[1]); }
    });
    intlCountries.sort();
    var totalCountries = intlCountries.length + 1; // +1 USA

    // Group usData by normalized state abbr
    var usByState = {};
    usData.forEach(function(c) {
      var s = normState(c[1]);
      if (!usByState[s]) usByState[s] = { cities: [], home: null, parks: [] };
      if (c[4]) usByState[s].home = c[0];
      else      usByState[s].cities.push(c[0]);
    });
    // Merge parks into state data
    usParks.forEach(function(p) {
      var s = p[2];
      if (!usByState[s]) usByState[s] = { cities: [], home: null, parks: [] };
      usByState[s].parks.push(p[0]);
    });

    var statesVisited = Object.keys(usByState).length;
    var usCitiesCount = usData.length;
    var parksCount    = usParks.length;

    // ── Sidebar render ─────────────────────────────────────────────────────────
    function renderSidebar() {
      var panel = document.getElementById('travels-sidebar');
      var mode  = sbBase !== 'world' ? sbBase
                : sbHover            ? 'country'
                : 'world';
      if      (mode === 'world')   { panel.innerHTML = buildWorldView(); }
      else if (mode === 'country') { panel.innerHTML = buildCountryView(sbHover); }
      else if (mode === 'usa')     { panel.innerHTML = buildUSAView();          attachUSAControls(); }
      else                         { panel.innerHTML = buildRegionView(mode);   attachRegionControls(); }
    }

    function e(tag, cls, html) {
      return '<' + tag + (cls ? ' class="' + cls + '"' : '') + '>' + html + '</' + tag + '>';
    }

    function buildWorldView() {
      var out = e('div', 'sb-title', 'travels');
      out += e('div', 'sb-stat', e('strong', '', totalCountries) + ' countries');
      out += e('div', 'sb-stat', e('strong', '', intl.length + usCitiesCount) + ' cities');
      out += e('div', 'sb-stat', e('strong', '', parksCount) + ' national parks');
      out += '<hr class="sb-divider">';
      out += e('div', 'sb-label', 'countries visited');
      intlCountries.forEach(function(c) { out += e('div', 'sb-item', c); });
      out += e('div', 'sb-item', 'United States');
      return out;
    }

    function buildCountryView(code) {
      if (!code || !countryInfo[code]) return buildWorldView();
      if (code === 'USA') {
        // Hover preview — don't lock sbBase; click locks it
        var out = e('div', 'sb-title', 'United States');
        out += e('div', 'sb-stat', e('strong', '', statesVisited) + ' states');
        out += e('div', 'sb-stat', e('strong', '', usCitiesCount) + ' cities');
        out += e('div', 'sb-stat', e('strong', '', parksCount) + ' national parks');
        out += '<hr class="sb-divider">';
        out += e('div', 'sb-label', 'click map to explore →');
        return out;
      }
      var info = countryInfo[code];
      var out  = e('div', 'sb-title', info.name);
      var cities = info.cities;
      out += e('div', 'sb-stat', e('strong', '', cities.length) + ' ' + (cities.length === 1 ? 'city' : 'cities'));
      if (cities.length) {
        out += '<hr class="sb-divider">';
        out += e('div', 'sb-label', 'cities');
        cities.forEach(function(c) { out += e('div', 'sb-item', c); });
      }
      return out;
    }

    function buildUSAView() {
      var out = e('div', 'sb-title', 'united states');
      out += e('div', 'sb-stat', e('strong', '', statesVisited) + ' states');
      out += e('div', 'sb-stat', e('strong', '', usCitiesCount) + ' cities');
      out += e('div', 'sb-stat', e('strong', '', parksCount) + ' national parks');
      out += '<hr class="sb-divider">';

      // Sort controls
      out += e('div', 'sb-label', 'sort');
      out += '<div class="sb-controls" id="sb-sort">';
      [['cities-desc','most cities'],['cities-asc','fewest'],['alpha','A–Z']].forEach(function(s) {
        out += '<button class="sb-btn' + (usSort === s[0] ? ' active' : '') + '" data-sort="' + s[0] + '">' + s[1] + '</button>';
      });
      out += '</div>';

      // Region filter
      out += e('div', 'sb-label', 'region');
      out += '<div class="sb-controls" id="sb-region">';
      ['all','northeast','appalachia','south','midwest','west'].forEach(function(r) {
        out += '<button class="sb-btn' + (usRegion === r ? ' active' : '') + '" data-region="' + r + '">' + r + '</button>';
      });
      out += '</div>';
      out += '<hr class="sb-divider">';

      // Build filtered + sorted state list
      var keys = Object.keys(usByState);
      if (usRegion !== 'all') {
        keys = keys.filter(function(s) { return stateRegions[s] === usRegion; });
      }
      keys.sort(function(a, b) {
        var ca = (usByState[a].home ? 1 : 0) + usByState[a].cities.length + usByState[a].parks.length;
        var cb = (usByState[b].home ? 1 : 0) + usByState[b].cities.length + usByState[b].parks.length;
        if (usSort === 'alpha') {
          var na = stateNames[a] || a, nb = stateNames[b] || b;
          return na < nb ? -1 : na > nb ? 1 : 0;
        }
        return usSort === 'cities-asc' ? ca - cb : cb - ca;
      });

      keys.forEach(function(s) {
        var sd = usByState[s];
        var total = (sd.home ? 1 : 0) + sd.cities.length + sd.parks.length;
        var citiesHtml = '';
        if (sd.home) citiesHtml += e('div', 'sb-item sb-item-home', '★ ' + sd.home);
        sd.cities.forEach(function(c) { citiesHtml += e('div', 'sb-item', c); });
        sd.parks.forEach(function(p) { citiesHtml += e('div', 'sb-item sb-item-park', '🌲 ' + p); });

        out += '<div class="sb-state">' +
          '<div class="sb-state-name">' +
            '<span>' + (stateNames[s] || s) + '</span>' +
            e('span', 'sb-state-count', total + '') +
          '</div>' +
          e('div', 'sb-state-cities', citiesHtml) +
          '</div>';
      });

      return out;
    }

    function attachUSAControls() {
      document.querySelectorAll('#sb-sort .sb-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { usSort = this.dataset.sort; renderSidebar(); });
      });
      document.querySelectorAll('#sb-region .sb-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { usRegion = this.dataset.region; renderSidebar(); });
      });
    }

    function buildRegionView(regionKey) {
      var codes = regions[regionKey].codes;
      var seen = {}, countries = [];
      codes.forEach(function(code) {
        var info = countryInfo[code];
        if (info && !seen[info.name]) {
          seen[info.name] = true;
          countries.push({ name: info.name, cities: info.cities });
        }
      });
      countries.sort(function(a, b) {
        if (regionSort === 'alpha') return a.name < b.name ? -1 : 1;
        if (regionSort === 'cities-asc') return a.cities.length - b.cities.length;
        return b.cities.length - a.cities.length;
      });
      var totalCities = countries.reduce(function(sum, c) { return sum + c.cities.length; }, 0);

      var out = e('div', 'sb-title', regionMeta[regionKey]);
      out += e('div', 'sb-stat', e('strong','',countries.length) + ' ' + (countries.length === 1 ? 'country' : 'countries'));
      out += e('div', 'sb-stat', e('strong','',totalCities) + ' cities');
      out += '<hr class="sb-divider">';
      out += e('div', 'sb-label', 'sort');
      out += '<div class="sb-controls" id="sb-rsort">';
      [['cities-desc','most'],['cities-asc','fewest'],['alpha','A–Z']].forEach(function(s) {
        out += '<button class="sb-btn'+(regionSort===s[0]?' active':'')+'" data-rsort="'+s[0]+'">'+s[1]+'</button>';
      });
      out += '</div><hr class="sb-divider">';
      countries.forEach(function(c) {
        out += '<div class="sb-state">' +
          '<div class="sb-state-name"><span>'+c.name+'</span>'+
          e('span','sb-state-count',c.cities.length+'')+
          '</div><div class="sb-state-cities">' +
          c.cities.map(function(city){ return e('div','sb-item',city); }).join('') +
          '</div></div>';
      });
      return out;
    }

    function attachRegionControls() {
      document.querySelectorAll('#sb-rsort .sb-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          regionSort = this.dataset.rsort;
          renderSidebar();
        });
      });
    }

    // Initial render
    renderSidebar();

    // ── Zoom events ────────────────────────────────────────────────────────────
    map.on('zoomend', function() {
      var z     = map.getZoom();
      var zoomed = z > 2;
      var inUSA  = currentRegion === 'usa' && zoomed;
      document.getElementById('world-btn').style.display = zoomed ? 'block' : 'none';
      setUSMarkers(inUSA);
      if (statesLayer) {
        if ( inUSA && !map.hasLayer(statesLayer)) statesLayer.addTo(map);
        if (!inUSA &&  map.hasLayer(statesLayer)) map.removeLayer(statesLayer);
      }
    });

    // ── World view button ──────────────────────────────────────────────────────
    document.getElementById('world-btn').addEventListener('click', function() {
      ignoreNextMapClick = true;
      resetToWorldView();
    });

    // ── Click ocean → world view ───────────────────────────────────────────────
    map.on('click', function() {
      if (ignoreNextMapClick) { ignoreNextMapClick = false; return; }
      if (map.getZoom() > 2) resetToWorldView();
    });

    // ── Scroll zoom ────────────────────────────────────────────────────────────
    document.getElementById('travels-map').addEventListener('click', function() {
      map.scrollWheelZoom.enable();
    });
    document.addEventListener('click', function(e) {
      if (!document.getElementById('travels-map').contains(e.target)) {
        map.scrollWheelZoom.disable();
      }
    });

    // ── GeoJSON world layer ────────────────────────────────────────────────────
    fetch('assets/data/world.geojson')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        L.geoJSON(data, {
          filter: function(f) { return f.properties.NAME !== 'Antarctica'; },
          style: function() {
            return { fillColor:'#1a1a1a', fillOpacity:1, color:'#2e2e2e', weight:0.5, opacity:1 };
          },
          onEachFeature: function(f, layer) {
            var name      = f.properties.NAME_EN || f.properties.NAME || '';
            var code      = f.properties.ADM0_A3;
            var regionKey = countryToRegion[code];
            var hasInfo   = !!countryInfo[code];

            layer.bindTooltip(name, {
              className: 'map-tt-country', sticky: true, direction: 'top', offset: [0, -4]
            });

            if (regionKey || hasInfo) {
              layer.on('mouseover', function() {
                this.setStyle({ fillColor:'#0a200a', fillOpacity:1, color:'#39ff14', weight:1.5, opacity:0.75 });
                var el = this.getElement();
                if (el) el.style.filter = buildGlow(countryCities[code] || 1);
                // Update sidebar only if not locked to a region view
                if (sbBase === 'world') {
                  sbHover = code;
                  renderSidebar();
                }
              });

              layer.on('mouseout', function() {
                this.setStyle({ fillColor:'#1a1a1a', fillOpacity:1, color:'#2e2e2e', weight:0.5, opacity:1 });
                var el = this.getElement();
                if (el) el.style.filter = '';
                if (sbBase === 'world') {
                  sbHover = null;
                  renderSidebar();
                }
              });

              if (regionKey) {
                var regionBounds = L.latLngBounds(regions[regionKey].bounds);
                layer.on('click', function() {
                  ignoreNextMapClick = true;
                  currentRegion = regionKey;
                  sbBase  = regionKey;
                  sbHover = null;
                  renderSidebar();
                  var pad = densityPadding[regions[regionKey].density] || 40;
                  map.flyToBounds(regionBounds, { padding: [pad, pad], duration: 1.2 });
                });
              }
            }
          }
        }).addTo(map);

        document.getElementById('map-loading').style.display = 'none';
      })
      .catch(function() {
        document.getElementById('map-loading').textContent = 'map failed to load';
      });

  </script>
  <script src="assets/js/player-bar.js"></script>

</body>
</html>
